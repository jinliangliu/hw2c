# Runtime parameters (typed accessors generated by hw2c P2)

params:
  - name: pid_kp
    component: pid_ctrl
    type: float
    default: 5.0
    min: 0.0
    max: 100.0
    description: "PID proportional gain (duty % per degC error)"

  - name: pid_ki
    component: pid_ctrl
    type: float
    default: 0.2
    min: 0.0
    max: 50.0
    description: "PID integral gain (per second)"

  - name: pid_kd
    component: pid_ctrl
    type: float
    default: 0.0
    min: 0.0
    max: 50.0
    description: "PID derivative gain (per second)"

  - name: pid_target
    component: pid_ctrl
    type: float
    default: 25.0
    min: -40.0
    max: 200.0
    description: "Default temperature setpoint (degC)"

  - name: pid_max_value
    component: pid_ctrl
    type: float
    default: 120.0
    min: 1.0
    max: 300.0
    description: "Over-temperature interlock threshold (degC)"

  - name: pid_duty_min_pct
    component: pid_ctrl
    type: uint32
    default: 0
    min: 0
    max: 100
    description: "Minimum effective heater duty; below this heater off"

  - name: pid_duty_max_pct
    component: pid_ctrl
    type: uint32
    default: 100
    min: 1
    max: 100
    description: "Maximum heater duty clamp (percent)"

  - name: pid_ramp_timeout_ms
    component: pid_ctrl
    type: uint32
    default: 60000
    min: 1000
    max: 600000
    description: "Ramp-up timeout before FAULT (ms)"
