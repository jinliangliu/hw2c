# Runtime parameters (typed accessors generated by hw2c P2)

params:
  - name: pid_kp
    component: pid_ctrl
    type: float
    default: 8.0
    min: 0.0
    max: 100.0
    description: "PID proportional gain (duty % per kPa error)"

  - name: pid_ki
    component: pid_ctrl
    type: float
    default: 0.8
    min: 0.0
    max: 50.0
    description: "PID integral gain (per second)"

  - name: pid_kd
    component: pid_ctrl
    type: float
    default: 0.0
    min: 0.0
    max: 50.0
    description: "PID derivative gain (per second)"

  - name: pid_target
    component: pid_ctrl
    type: float
    default: 100.0
    min: 0.0
    max: 1000.0
    description: "Default pressure setpoint (kPa)"

  - name: pid_max_value
    component: pid_ctrl
    type: float
    default: 500.0
    min: 1.0
    max: 1000.0
    description: "Over-pressure interlock threshold (kPa)"

  - name: pid_duty_min_pct
    component: pid_ctrl
    type: uint32
    default: 5
    min: 0
    max: 100
    description: "Minimum effective duty; below this the valve stays closed"

  - name: pid_duty_max_pct
    component: pid_ctrl
    type: uint32
    default: 100
    min: 1
    max: 100
    description: "Maximum duty clamp (percent)"

  - name: pid_ramp_timeout_ms
    component: pid_ctrl
    type: uint32
    default: 30000
    min: 1000
    max: 300000
    description: "Ramp-up timeout before FAULT (ms)"
