# ============================================================
# hw2c knob_demo — software tasks layer
# ============================================================

project:
  name: knob_demo
  version: "1.0.0"
  heap_size: 16384

event_task:
  name: events_process_task
  entry: vEventTask
  priority: 3
  stack_size: 512
  queue_depth: 16

behavior:
  initial_state: IDLE
  # Typed event contract: KNOB_TURNED carries a uint32 payload (turn count).
  events:
    - name: KNOB_TURNED
      source: custom
      type: asynchronous
      payload: { type: uint32 }
  states:
    - name: IDLE
      transitions:
        - event: BUTTON_SHORT_PRESS
          target: IDLE
          actions:
            - led_pattern fast_blink
            - 'log "button: SHORT_PRESS"'
        - event: BUTTON_DOUBLE_PRESS
          target: IDLE
          actions:
            - led_pattern slow_blink
            - 'log "button: DOUBLE_PRESS"'
        - event: BUTTON_LONG_PRESS
          target: IDLE
          actions:
            - led_pattern fault
            - 'log "button: LONG_PRESS"'
        # Knob turned by more than the threshold -> blink LED
        - event: KNOB_TURNED
          target: IDLE
          actions:
            - led_pattern fast_blink
            - 'log "knob turned"'
