# ============================================================
# hw2c mpu6050_demo — software tasks layer
#
# System tasks (FreeRTOS):
#   events_process_task  Centralized event dispatch via queue
#   cli_task             CLI interaction + log output via USART2 (auto)
#
# Components (hw2c component framework):
#   led / btn            UI components
#   mpu6050              IMU sampling + attitude fusion (i2c_api bus)
# ============================================================

project:
  name: mpu6050_demo
  version: "1.0.0"
  heap_size: 24576

event_task:
  name: events_process_task
  entry: vEventTask
  priority: 3
  stack_size: 512
  queue_depth: 16

# Button gesture → LED pattern mapping
behavior:
  initial_state: IDLE
  # Typed event contracts: FALL_DETECTED carries a float payload (g).
  events:
    - name: FALL_DETECTED
      source: custom
      type: asynchronous
      payload: { type: float, unit: "g", range: [0, 4] }
  states:
    - name: IDLE
      transitions:
        - event: BUTTON_SHORT_PRESS
          target: IDLE
          actions:
            - led_pattern fast_blink
            - 'log "button: SHORT_PRESS"'
        - event: BUTTON_DOUBLE_PRESS
          target: IDLE
          actions:
            - led_pattern slow_blink
            - 'log "button: DOUBLE_PRESS"'
        - event: BUTTON_LONG_PRESS
          target: IDLE
          actions:
            - led_pattern fault
            - 'log "button: LONG_PRESS"'
        # Fall detected by the fall_detect component -> alarm LED + log
        - event: FALL_DETECTED
          target: IDLE
          actions:
            - led_pattern fault
            - 'log "FALL detected -> alarm"'

# Periodic RTC alarm events (no tick spam)
periodic_events:
  - event: SECONDS_30
    actions:
      - telemetry_snapshot
