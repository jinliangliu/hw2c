# Runtime parameter definitions for MHDE mainboard
# Parameters marked persistent survive power cycles in external SPI NOR.

params:
  - name: led_brightness
    component: shell
    type: uint32
    default: 200
    min: 0
    max: 255
    description: "LED PWM duty cycle (0..255)"

  - name: log_level
    component: system
    type: uint32
    default: 3
    min: 0
    max: 4
    description: "Log level (0=OFF, 1=ERROR, 2=WARN, 3=INFO, 4=DEBUG)"

  - name: telemetry_enabled
    component: system
    type: bool
    default: true
    description: "Enable periodic telemetry snapshot logging"

  - name: telemetry_interval_s
    component: system
    type: uint32
    default: 30
    min: 10
    max: 3600
    description: "Telemetry report interval in seconds"

  - name: sleep_depth
    component: system
    type: uint32
    default: 0
    min: 0
    max: 5
    description: "Sleep mode depth: 0=RUN, 1=SLEEP, 2=STOP0, 3=STOP1, 4=STOP2, 5=STANDBY"

  - name: btn_BUTTON_GEAR_long_press_ms
    component: btn
    type: uint32
    default: 3000
    min: 200
    max: 10000
    description: "Button 'BUTTON_GEAR' long press threshold (ms)"

  - name: btn_BUTTON_GEAR_double_click_ms
    component: btn
    type: uint32
    default: 500
    min: 150
    max: 2000
    description: "Button 'BUTTON_GEAR' double click timeout window (ms)"

  # Persistent parameters — survive firmware upgrades
  - name: device_serial
    component: system
    type: uint32
    default: 0
    persistent: true
    description: "Device serial number (preserved across OTA)"

  - name: cal_zero_offset
    component: system
    type: int32
    default: 0
    min: -10000
    max: 10000
    persistent: true
    description: "Sensor calibration zero offset (preserved across OTA)"

  - name: ota_count
    component: system
    type: uint32
    default: 0
    persistent: true
    description: "Number of completed OTA updates (preserved across OTA)"
