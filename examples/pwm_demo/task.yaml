# ============================================================
# hw2c pwm_demo — software tasks layer
# ============================================================

project:
  name: pwm_demo
  version: "1.0.0"

event_task:
  name: events_process_task
  entry: vEventTask
  priority: 3
  stack_size: 512
  queue_depth: 16

behavior:
  initial_state: IDLE
  states:
    - name: IDLE
      transitions:
        - event: BUTTON_SHORT_PRESS
          target: IDLE
          actions:
            - led_pattern fast_blink
            - 'log "button: SHORT_PRESS"'
        - event: BUTTON_DOUBLE_PRESS
          target: IDLE
          actions:
            - led_pattern slow_blink
            - 'log "button: DOUBLE_PRESS"'
        - event: BUTTON_LONG_PRESS
          target: IDLE
          actions:
            - led_pattern fault
            - 'log "button: LONG_PRESS"'
