# ============================================================================
# P25Q64H —— Puya（普冉）64 Mbit 串行多 I/O NOR Flash
#
#   型号       P25Q64H-SSH-IR（SOP8 150mil，工业级 -40~85 ℃，编带）
#   手册       P25Q64H_Datasheet_V1.4（Puya Semiconductor，2020-09-30）
#
#   本文件里的每一个数字都来自手册，不是估算值 —— 因为生成器要拿它们
#   做几何与型号一致性校验（见 generator/device_models.py）：
#   `jedec_id` 的容量字节必须与 `total_size` 自洽、页必须整除扇区、
#   扇区必须是 2 的幂。写错的模型会让生成出来的驱动按错误的粒度擦写，
#   而症状是"偶发丢数据"，不是编译错误。
#
#   已验证事实（可依此复核，不要凭印象改）：
#     · RDID(0x9F) => 85 60 17   （厂家 0x85，类型 0x60，容量 0x17）
#       容量字节 0x17 ⇒ 2^23 = 8,388,608 B = 8 MB
#     · 均匀 256 B 页编程 / 均匀 4 KB 扇区擦 / 32K·64K 块擦 / 整片擦
#     · 2.3 ~ 3.6 V，100k 次擦写，20 年保存，支持 Mode 0 与 Mode 3
#     · 8 MB 地址空间落在 24 位内 ⇒ 3 字节地址，不需要 4 字节地址模式
# ============================================================================
model: "P25Q64H"
type: "SPI_Flash"
interface: "SPI"
driver_template: "drivers/drv_spi_flash.c.j2"
header_template: "drivers/drv_spi_flash.h.j2"

vendor: "Puya"
part_number: "P25Q64H-SSH-IR"

spi_mode: 0            # CPOL=0, CPHA=0（器件同时支持 Mode 3）
max_freq: 4000000      # 保守取值：手册标称 120 MHz，但受本板走线与通用性限制
address_bytes: 3       # 8 MB < 16 MB，3 字节地址即可

# ---- 几何（手册 §7 Memory Address Mapping）----
page_size: 256         # 页编程粒度
sector_size: 4096      # 扇区擦除粒度（0x20）
block_size_32k: 32768  # 块擦除（0x52）
block_size_64k: 65536  # 块擦除（0xD8）
total_size: 8388608    # 8 MB = 8,388,608 B

# ---- 器件识别 ----
jedec_id: [0x85, 0x60, 0x17]

# ---- 命令集（手册 §10.1；只列本驱动会发的，避免"声明了但没人用"）----
commands:
  READ_ID: 0x9F            # RDID，1 字节厂家 + 2 字节器件 ID
  READ_DATA: 0x03          # READ，任意速率、无 dummy
  FAST_READ: 0x0B          # 高速读，1 字节 dummy
  WRITE_ENABLE: 0x06       # WREN，置 WEL
  WRITE_DISABLE: 0x04      # WRDI，清 WEL
  READ_STATUS: 0x05        # RDSR-1，位 0 = WIP（写/擦进行中）
  PAGE_PROGRAM: 0x02       # PP，写前必须 WREN，跨页会在页内回绕
  SECTOR_ERASE: 0x20       # SE，4 KB
  BLOCK_ERASE_32K: 0x52    # BE32K
  BLOCK_ERASE_64K: 0xD8    # BE64K
  CHIP_ERASE: 0xC7         # CE（另有 0x60 等价码）
  DEEP_POWER_DOWN: 0xB9    # DP，待机 <1 µA
  RELEASE_POWER_DOWN: 0xAB # RDP，同时可读电子 ID

# ---- 状态寄存器位（手册 §10.5 Read Status Register）----
status_bits:
  WIP: 0x01   # Write In Progress —— 必须轮询，不能用固定延时顶替
  WEL: 0x02   # Write Enable Latch

# ---- 时序上限（手册 §1 Overview / §5.4）----
# 用于给 WIP 轮询设超时。手册给的是 max，取整数倍余量后仍远小于
# 任何合理的任务周期，所以超时只会在器件真的失联时触发。
timing:
  page_program_ms: 2
  sector_erase_ms: 10
  block_erase_32k_ms: 10
  block_erase_64k_ms: 10
  chip_erase_ms: 9000

extra_schema:
  cs_pin:
    type: "pin"
    required: true
  spi_speed_hz:
    type: "int"
    required: false
  total_size:
    type: "int"
    required: false
