model: "I2C_TempSensor"
type: "I2C_TempSensor"
interface: "I2C"
address: 0x48
driver_template: "drivers/drv_pressure.c.j2"
header_template: "drivers/drv_pressure.h.j2"
# Generic I2C digital temperature sensor model, sharing the same linear
# raw*scale+offset driver as I2C_Pressure (unit = degC).  Adjust
# reg_start / scale / offset / data_width / byte_order for the actual part.
registers:
  DATA_START: 0x00
extra_schema:
  reg_start:
    type: int
    required: false
    default: 0
  scale_per_lsb:
    type: float
    required: false
    default: 0.01
  offset:
    type: float
    required: false
    default: 0.0
  unit:
    type: str
    required: false
    default: "degC"
  data_width:
    type: int
    required: false
    default: 16
    values: [8, 16, 24]
  byte_order:
    type: str
    required: false
    default: "big"
    values: ["big", "little"]
